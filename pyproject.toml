[project]
name = "ai-tutor-autopilot"
version = "0.1.0"
description = "Live AI Tutor infra: FastAPI orchestrator, Celery, Redis, Postgres, MinIO, feature flags, telemetry, CI/CD."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.1",
  "pydantic==2.7.1",
  "pydantic-settings==2.2.1",
  "SQLAlchemy==2.0.30",
  "psycopg[binary]==3.1.18",
  "alembic==1.13.1",
  "redis==5.0.4",
  "celery==5.4.0",
  "httpx==0.27.0",
  "minio==7.2.7",
  "PyJWT==2.8.0",
  "typer==0.12.3",
  "PyYAML==6.0.1",
  "structlog==24.1.0"
]

[project.optional-dependencies]
dev = [
  "ruff==0.5.0",
  "black==24.4.2",
  "mypy==1.10.0",
  "pytest==8.2.1",
  "pytest-asyncio==0.23.7",
  "coverage==7.5.3",
  "diff-cover==9.0.0"
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E","F","B","I","UP","PL","N"]
ignore = ["E501"]
src = ["apps","opsctl","policy"]

[tool.mypy]
python_version = "3.11"
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
exclude = ["infrastructure/migrations/"]
plugins = []

[tool.mypy."apps.api.*"]
strict = true
ignore_missing_imports = true

[tool.mypy."apps.sidecar.*"]
strict = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["apps"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
