services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    image: ai-tutor-autopilot:latest
    env_file: ../.env
    environment:
      - PYTHONPATH=/app
    command: bash -lc "python scripts/wait_for_it.py db 5432 -- uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - minio
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [appnet]
    volumes:
      - ..:/app

  worker:
    image: ai-tutor-autopilot:latest
    env_file: ../.env
    environment:
      - PYTHONPATH=/app
    command: bash -lc "python scripts/wait_for_it.py api 8000 -- celery -A apps.api.celery_app worker -Q api,frontend,infra,etl -O fair --concurrency ${WORKER_CONCURRENCY:-2}"
    depends_on:
      - api
      - redis
    restart: unless-stopped
    networks: [appnet]
    volumes:
      - ..:/app

  beat:
    image: ai-tutor-autopilot:latest
    env_file: ../.env
    environment:
      - PYTHONPATH=/app
    command: bash -lc "python scripts/wait_for_it.py api 8000 -- celery -A apps.api.celery_app beat -l INFO"
    depends_on:
      - api
      - redis
    restart: unless-stopped
    networks: [appnet]
    volumes:
      - ..:/app

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
    networks: [appnet]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [appnet]

  minio:
    image: minio/minio
    env_file: ../.env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    restart: unless-stopped
    networks: [appnet]

  caddy:
    image: caddy:latest
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    restart: unless-stopped
    networks: [appnet]

volumes:
  pgdata:
  minio:

networks:
  appnet:
    driver: bridge


