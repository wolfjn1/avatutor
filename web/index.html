<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Tutor MVP</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
      #partials { white-space: pre-wrap; border: 1px solid #ddd; padding: 8px; min-height: 60px; }
      #avatar { font-size: 48px; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 12px; background: #eee; margin-right: 6px; }
    </style>
  <link rel="stylesheet" href="/tokens.css" /><link rel="stylesheet" href="/avatar.css" /></head>
  <body>
    <h2>Live AI Tutor MVP</h2>
    <div>
      <span class="pill" id="provider-stt">stt: mock</span>
      <span class="pill" id="provider-llm">llm: echo</span>
      <span class="pill" id="provider-tts">tts: mock</span>
      <span class="pill" id="provider-avatar">avatar: mock</span>
    </div>
    <p>
      Spacebar: push-to-talk. Toggle VAD: <button id="btn-vad">Off</button>
    </p>
    <div>
      <button id="btn-connect">Connect</button>
      <button id="btn-disconnect">Disconnect</button>
    </div>
    <h3>Partial transcripts</h3>
    <div id="partials"></div>
    <h3>LLM</h3>
    <div>First token: <span id="first-token">(waiting)</span></div>
    <h3>TTS</h3>
    <audio id="audio" controls></audio>
    <h3>Avatar</h3>
    <div id="avatar">🙂</div>

    <section style="margin-top:16px;padding:8px;border:1px solid #eee;border-radius:8px;">
      <h3 style="margin-top:0">Telemetry</h3>
      <div>Tokens in: <span id="tokens-in">0</span> • Tokens out: <span id="tokens-out">0</span> • Price: $<span id="price-usd">0.0000</span></div>
    </section>

    <script type="module" src="/main.js"></script>
  <div class="avatar"><div id="mouth" class="avatar-mouth"></div></div>
<section id="session-panel" style="margin-top:16px;padding:12px;border:1px solid #eee;border-radius:8px;"><h3 style="margin:0 0 8px 0">Tutoring Session</h3><div id="transcript" style="min-height:80px;font-family:monospace;white-space:pre-wrap;"></div><div style="margin-top:8px"><button id="start">Start</button> <button id="stop">Stop</button></div></section>
</body>
  </html>
